<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>संपर्क करो | Toolkit</title>
<meta name="theme-color" content="#6c4dff">
<link rel="stylesheet" href="assets/styles.css?v=4">
</head>
<body>
<div class="tool-top"><a class="back-btn" href="index.html">←</a><h1>संपर्क करो</h1></div>
<div class="tool-body">
<p style="color:var(--muted);margin-bottom:1rem">सुझाव, बग रिपोर्ट या नया टूल चाहिए? बताओ — हम पढ़ते हैं।</p>
<div class="panel">
<form action="mailto:sivonexO@gmail.com" method="post" enctype="text/plain">
<div class="field"><label for="c-name">आपका नाम</label><input type="text" id="c-name" name="name" required></div>
<div class="field"><label for="c-email">आपका ईमेल</label><input type="text" id="c-email" name="email" required></div>
<div class="field"><label for="c-msg">संदेश</label><textarea id="c-msg" name="message" required placeholder="कौन सा नया टूल बनाएं?"></textarea></div>
<button class="btn" type="submit">भेजो</button>
</form>
</div>
</div>
</body>
</html>
