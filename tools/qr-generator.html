<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QR Generator — QR कोड बनाओ | Toolkit</title>
<meta name="description" content="फ्री QR कोड जनरेटर: लिंक या टेक्स्ट का QR बनाओ और डाउनलोड करो।">
<meta name="theme-color" content="#6c4dff">
<link rel="stylesheet" href="../assets/styles.css?v=3">
</head>
<body>
<div class="tool-top"><a class="back-btn" href="../index.html">←</a><h1>🔳 QR Generator</h1></div>
<div class="tool-body">
  <p style="color:var(--muted);margin-bottom:1rem">लिंक, नंबर या टेक्स्ट का QR बनाओ।</p>
  <div class="panel">
    <div class="field">
      <label for="qr-text">टेक्स्ट / लिंक</label>
      <input type="text" id="qr-text" placeholder="https://example.com">
    </div>
    <button class="btn" id="qr-make">🔳 QR बनाओ</button>
    <div id="qr-result" class="result" hidden style="text-align:center">
      <div id="qr-box"></div>
      <div class="btn-row" style="justify-content:center"><button class="btn secondary" id="qr-download">⬇️ डाउनलोड</button></div>
    </div>
  </div>
  <div class="ad-slot">Advertisement</div>
  <div class="info-card"><h2>जानकारी</h2><p>QR कोड की कोई expiry नहीं होती। आपका डेटा कहीं सेव नहीं होता — सब ब्राउज़र में बनता है।</p></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../assets/tools.js?v=1"></script>
</body>
</html>
