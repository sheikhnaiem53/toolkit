<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Age Calculator — उम्र निकालो | Toolkit</title>
<meta name="description" content="फ्री एज कैलकुलेटर: जन्मतिथि से सही उम्र — साल, महीने, दिन में।">
<meta name="theme-color" content="#6c4dff">
<link rel="stylesheet" href="../assets/styles.css?v=3">
</head>
<body>
<div class="tool-top"><a class="back-btn" href="../index.html">←</a><h1>🎂 Age Calculator</h1></div>
<div class="tool-body">
  <p style="color:var(--muted);margin-bottom:1rem">जन्मतिथि डालो — सही उम्र पाओ।</p>
  <div class="panel">
    <div class="field">
      <label for="age-dob">जन्मतिथि</label>
      <input type="date" id="age-dob">
    </div>
    <button class="btn" id="age-go">उम्र निकालो</button>
    <div id="age-result" class="result" hidden>
      <div class="big" id="age-big">—</div>
      <div class="kv"><span>महीने</span><b id="age-months">—</b></div>
      <div class="kv"><span>कुल दिन</span><b id="age-days">—</b></div>
      <div class="kv"><span>जन्म का दिन</span><b id="age-weekday">—</b></div>
    </div>
  </div>
  <div class="ad-slot">Advertisement</div>
  <div class="info-card"><h2>काम की जगह</h2><ul><li>परीक्षा, नौकरी, सरकारी योजना की उम्र-सीमा चेक करो।</li><li>फॉर्म में साल-महीने वाली उम्र भरो।</li></ul></div>
</div>
<script src="../assets/tools.js?v=1"></script>
</body>
</html>
