<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI Chat — फ्री AI से बात करो | Toolkit</title>
<meta name="description" content="फ्री AI चैट: कोई भी सवाल पूछो, AI से जवाब पाओ। बिना साइनअप, बिना API key।">
<meta name="theme-color" content="#6c4dff">
<link rel="stylesheet" href="../assets/styles.css?v=4">
<style>
.chat-box { display: flex; flex-direction: column; gap: .7rem; max-height: 46vh; overflow-y: auto; margin-bottom: 1rem; }
.msg { padding: .8rem 1rem; border-radius: 16px; font-size: .95rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.msg.user { background: var(--brand); color: #fff; align-self: flex-end; border-bottom-right-radius: 6px; max-width: 88%; }
.msg.ai { background: #fff; align-self: flex-start; border-bottom-left-radius: 6px; max-width: 92%; box-shadow: 0 2px 8px rgba(27,27,47,.07); }
.msg.typing { color: var(--muted); }
.chat-input-row { display: flex; gap: .5rem; }
.chat-input-row input { flex: 1; }
</style>
</head>
<body>
<div class="tool-top">
  <a class="back-btn" href="../index.html">←</a>
  <h1>🤖 AI Chat</h1>
</div>
<div class="tool-body">
  <div class="panel">
    <div class="chat-box" id="chat-box">
      <div class="msg ai">नमस्ते! 🙏 मैं आपका AI सहायक हूँ। कुछ भी पूछो — हिंदी या English में।</div>
    </div>
    <div class="chat-input-row">
      <input type="text" id="chat-in" placeholder="अपना सवाल लिखो...">
      <button class="btn" id="chat-send">➤</button>
    </div>
  </div>
  <div class="ad-slot">Advertisement</div>
  <div class="info-card">
    <h2>नोट</h2>
    <p>ये फ्री AI सेवा से चलता है — जवाब में कुछ सेकंड लग सकते हैं। निजी/बैंक जानकारी यहाँ न लिखें।</p>
  </div>
</div>
<script src="../assets/tools.js?v=2"></script>
</body>
</html>
