<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Unit Converter — इकाई बदलो | Toolkit</title>
<meta name="description" content="फ्री यूनिट कन्वर्टर: लंबाई, वज़न, तापमान तुरंत बदलो।">
<meta name="theme-color" content="#6c4dff">
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<div class="tool-top"><a class="back-btn" href="../index.html">←</a><h1>📏 Unit Converter</h1></div>
<div class="tool-body">
  <p style="color:var(--muted);margin-bottom:1rem">लंबाई, वज़न, तापमान — तुरंत बदलो।</p>
  <div class="panel">
    <div class="field">
      <label for="uc-cat">श्रेणी</label>
      <select id="uc-cat">
        <option value="length">लंबाई</option>
        <option value="weight">वज़न</option>
        <option value="temp">तापमान</option>
      </select>
    </div>
    <div class="field">
      <label for="uc-val">मान</label>
      <input type="number" id="uc-val" placeholder="संख्या लिखो" step="any">
    </div>
    <div class="field" style="display:flex;gap:.8rem">
      <div style="flex:1"><label for="uc-from">से</label><select id="uc-from"></select></div>
      <div style="flex:1"><label for="uc-to">तक</label><select id="uc-to"></select></div>
    </div>
    <div class="result">
      <span style="color:var(--muted);font-size:.9rem">नतीजा</span>
      <div class="big" id="uc-out">—</div>
    </div>
  </div>
  <div class="ad-slot">Advertisement</div>
</div>
<script src="../assets/tools.js"></script>
</body>
</html>
