<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GST Calculator — GST जोड़ो/घटाओ | Toolkit</title>
<meta name="description" content="फ्री GST कैलकुलेटर: 5%, 12%, 18%, 28% GST जोड़ो या घटाओ।">
<meta name="theme-color" content="#6c4dff">
<link rel="stylesheet" href="../assets/styles.css?v=4">
</head>
<body>
<div class="tool-top"><a class="back-btn" href="../index.html">←</a><h1>🧾 GST Calculator</h1></div>
<div class="tool-body">
  <p style="color:var(--muted);margin-bottom:1rem">GST जोड़ो या घटाओ — सारे भारतीय स्लैब।</p>
  <div class="panel">
    <div class="field">
      <label for="gst-amt">राशि (₹)</label>
      <input type="number" id="gst-amt" placeholder="जैसे 10000" step="any">
    </div>
    <div class="field">
      <label for="gst-rate">GST दर</label>
      <select id="gst-rate">
        <option value="5">5%</option>
        <option value="12">12%</option>
        <option value="18" selected>18%</option>
        <option value="28">28%</option>
      </select>
    </div>
    <div class="field">
      <label>हिसाब का तरीका</label>
      <div class="radio-row">
        <label><input type="radio" name="gst-mode" value="add" checked> GST जोड़ो</label>
        <label><input type="radio" name="gst-mode" value="remove"> GST घटाओ</label>
      </div>
    </div>
    <div class="result">
      <div class="kv"><span>मूल राशि</span><b id="gst-base">—</b></div>
      <div class="kv"><span>GST राशि</span><b id="gst-tax">—</b></div>
      <div class="kv"><span>कुल</span><b id="gst-total" style="color:var(--brand)">—</b></div>
    </div>
  </div>
  <div class="ad-slot">Advertisement</div>
  <div class="info-card"><h2>नोट</h2><p>ये तुरंत अनुमान है, टैक्स सलाह नहीं। फाइलिंग के लिए अपने CA से कन्फर्म करें।</p></div>
</div>
<script src="../assets/tools.js?v=2"></script>
</body>
</html>
