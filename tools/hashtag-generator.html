<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hashtag Generator — वायरल हैशटैग बनाओ | Toolkit</title>
<meta name="description" content="फ्री हैशटैग जनरेटर: अपनी पोस्ट के लिए ट्रेंडिंग हैशटैग पाओ। Instagram, YouTube, Facebook के लिए।">
<meta name="theme-color" content="#6c4dff">
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<div class="tool-top">
  <a class="back-btn" href="../index.html">←</a>
  <h1>#️⃣ Hashtag Generator</h1>
</div>
<div class="tool-body">
  <p style="color:var(--muted);margin-bottom:1rem">पोस्ट का विषय बताओ — AI ट्रेंडिंग हैशटैग सुझाएगा।</p>
  <div class="panel">
    <div class="field">
      <label for="ht-topic">विषय</label>
      <input type="text" id="ht-topic" placeholder="जैसे: fitness motivation, diwali wishes...">
    </div>
    <button class="btn" id="ht-go">#️⃣ हैशटैग बनाओ</button>
    <div id="ht-result" class="result" hidden>
      <div id="ht-out" class="mono"></div>
      <div class="btn-row">
        <button class="btn secondary" id="ht-copy">📋 सारे कॉपी करो</button>
      </div>
    </div>
  </div>
  <div class="ad-slot">Advertisement</div>
</div>
<script src="../assets/tools.js"></script>
</body>
</html>
