<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Color Picker — रंग चुनो, HEX कोड पाओ | Toolkit</title>
<meta name="description" content="फ्री कलर पिकर: कोई भी रंग चुनो, HEX/RGB कोड पाओ और कॉपी करो।">
<meta name="theme-color" content="#6c4dff">
<link rel="stylesheet" href="../assets/styles.css?v=3">
</head>
<body>
<div class="tool-top">
  <a class="back-btn" href="../index.html">←</a>
  <h1>🎨 Color Picker</h1>
</div>
<div class="tool-body">
  <p style="color:var(--muted);margin-bottom:1rem">रंग चुनो — HEX और RGB कोड तुरंत पाओ।</p>
  <div class="panel">
    <div class="field">
      <label for="cp-input">रंग चुनो</label>
      <input type="color" id="cp-input" value="#6c4dff">
    </div>
    <div class="result">
      <div class="kv"><span>HEX</span><b id="cp-hex">#6C4DFF</b></div>
      <div class="kv"><span>RGB</span><b id="cp-rgb">—</b></div>
    </div>
    <div class="btn-row">
      <button class="btn secondary" id="cp-copy">📋 HEX कॉपी करो</button>
    </div>
    <h3 style="margin:1.2rem 0 .6rem">लोकप्रिय रंग</h3>
    <div class="swatch-row" id="cp-swatches"></div>
  </div>
  <div class="ad-slot">Advertisement</div>
</div>
<script src="../assets/tools.js?v=1"></script>
</body>
</html>
