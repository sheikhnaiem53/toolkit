<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BMI Calculator — बॉडी मास इंडेक्स | Toolkit</title>
<meta name="description" content="फ्री BMI कैलकुलेटर: लंबाई-वज़न से BMI और हेल्थ कैटेगरी जानो।">
<meta name="theme-color" content="#6c4dff">
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<div class="tool-top"><a class="back-btn" href="../index.html">←</a><h1>⚖️ BMI Calculator</h1></div>
<div class="tool-body">
  <p style="color:var(--muted);margin-bottom:1rem">लंबाई-वज़न डालो — BMI और कैटेगरी पाओ।</p>
  <div class="panel">
    <div class="field">
      <label for="bmi-h">लंबाई (cm)</label>
      <input type="number" id="bmi-h" placeholder="जैसे 170" step="any">
    </div>
    <div class="field">
      <label for="bmi-w">वज़न (kg)</label>
      <input type="number" id="bmi-w" placeholder="जैसे 65" step="any">
    </div>
    <button class="btn" id="bmi-go">BMI निकालो</button>
    <div id="bmi-result" class="result" hidden>
      <span style="color:var(--muted);font-size:.9rem">आपका BMI</span>
      <div class="big" id="bmi-val">—</div>
      <div class="kv"><span>कैटेगरी</span><b id="bmi-cat">—</b></div>
      <div class="kv"><span>सही वज़न रेंज</span><b id="bmi-range">—</b></div>
    </div>
  </div>
  <div class="ad-slot">Advertisement</div>
  <div class="info-card"><h2>BMI कैटेगरी (WHO)</h2><ul><li>18.5 से कम — कम वज़न</li><li>18.5 से 24.9 — सामान्य</li><li>25 से 29.9 — ज़्यादा वज़न</li><li>30+ — मोटापा</li></ul><p><em>नोट:</em> BMI सिर्फ़ शुरुआती जांच है, डॉक्टर की सलाह नहीं।</p></div>
</div>
<script src="../assets/tools.js"></script>
</body>
</html>
