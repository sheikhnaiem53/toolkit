<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI Writer — शायरी, कहानी, निबंध लिखवाओ | Toolkit</title>
<meta name="description" content="फ्री AI राइटर: शायरी, कहानी, निबंध या टेक्स्ट सुधार — हिंदी और English में।">
<meta name="theme-color" content="#6c4dff">
<link rel="stylesheet" href="../assets/styles.css?v=3">
</head>
<body>
<div class="tool-top">
  <a class="back-btn" href="../index.html">←</a>
  <h1>✍️ AI Writer</h1>
</div>
<div class="tool-body">
  <p style="color:var(--muted);margin-bottom:1rem">मोड चुनो, विषय बताओ — AI लिख देगा।</p>
  <div class="panel">
    <div class="field">
      <label for="aiw-mode">मोड</label>
      <select id="aiw-mode">
        <option value="shayari">🎭 शायरी</option>
        <option value="story">📖 छोटी कहानी</option>
        <option value="essay">📝 निबंध</option>
        <option value="caption">📣 सोशल मीडिया कैप्शन</option>
        <option value="paraphrase">🔄 टेक्स्ट सुधारो</option>
      </select>
    </div>
    <div class="field">
      <label for="aiw-topic">विषय / टेक्स्ट</label>
      <textarea id="aiw-topic" style="min-height:90px" placeholder="जैसे: बारिश पर शायरी..."></textarea>
    </div>
    <button class="btn" id="aiw-go">✨ लिखवाओ</button>
    <div id="aiw-result" class="result" hidden>
      <div id="aiw-out" style="white-space:pre-wrap;line-height:1.7"></div>
      <div class="btn-row">
        <button class="btn secondary" id="aiw-copy">📋 कॉपी करो</button>
      </div>
    </div>
  </div>
  <div class="ad-slot">Advertisement</div>
</div>
<script src="../assets/tools.js?v=1"></script>
</body>
</html>
