<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Percentage Calculator — प्रतिशत निकालो | Toolkit</title>
<meta name="description" content="फ्री परसेंटेज कैलकुलेटर: छूट, नंबर, बढ़त-घटत — सब हिसाब एक जगह।">
<meta name="theme-color" content="#6c4dff">
<link rel="stylesheet" href="../assets/styles.css?v=3">
</head>
<body>
<div class="tool-top"><a class="back-btn" href="../index.html">←</a><h1>📊 Percentage Calculator</h1></div>
<div class="tool-body">
  <p style="color:var(--muted);margin-bottom:1rem">छूट, नंबर, बढ़त — रोज़ के प्रतिशत हिसाब।</p>
  <div class="panel">
    <h3 style="margin-bottom:.8rem">X का Y% कितना?</h3>
    <div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">
      <input type="number" id="p1-x" placeholder="X" step="any" style="flex:1;min-width:80px">
      <span>का</span>
      <input type="number" id="p1-y" placeholder="Y" step="any" style="flex:1;min-width:80px">
      <span>%</span>
      <button class="btn" id="p1-go">=</button>
    </div>
    <div class="result"><div class="big" id="p1-out">—</div></div>
  </div>
  <div class="panel">
    <h3 style="margin-bottom:.8rem">X, Y का कितना % है?</h3>
    <div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">
      <input type="number" id="p2-x" placeholder="X" step="any" style="flex:1;min-width:80px">
      <span>,</span>
      <input type="number" id="p2-y" placeholder="Y" step="any" style="flex:1;min-width:80px">
      <span>का %</span>
      <button class="btn" id="p2-go">=</button>
    </div>
    <div class="result"><div class="big" id="p2-out">—</div></div>
  </div>
  <div class="panel">
    <h3 style="margin-bottom:.8rem">बदलाव % (पुराना → नया)</h3>
    <div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">
      <input type="number" id="p3-old" placeholder="पुराना" step="any" style="flex:1;min-width:80px">
      <span>→</span>
      <input type="number" id="p3-new" placeholder="नया" step="any" style="flex:1;min-width:80px">
      <button class="btn" id="p3-go">=</button>
    </div>
    <div class="result"><div class="big" id="p3-out">—</div></div>
  </div>
  <div class="ad-slot">Advertisement</div>
</div>
<script src="../assets/tools.js?v=1"></script>
</body>
</html>
