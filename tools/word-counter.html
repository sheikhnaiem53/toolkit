<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Word Counter — शब्द गिनो | Toolkit</title>
<meta name="description" content="फ्री वर्ड काउंटर: शब्द, अक्षर, वाक्य गिनो। टाइप करते ही नतीजा।">
<meta name="theme-color" content="#6c4dff">
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<div class="tool-top"><a class="back-btn" href="../index.html">←</a><h1>📝 Word Counter</h1></div>
<div class="tool-body">
  <p style="color:var(--muted);margin-bottom:1rem">निबंध, पोस्ट, आर्टिकल — लिखते ही गिनती।</p>
  <div class="panel">
    <div class="field">
      <label for="words-input">अपना टेक्स्ट</label>
      <textarea id="words-input" placeholder="यहाँ लिखो या पेस्ट करो..."></textarea>
    </div>
    <div class="stat-grid">
      <div class="stat"><b id="w-words">0</b><span>शब्द</span></div>
      <div class="stat"><b id="w-chars">0</b><span>अक्षर</span></div>
      <div class="stat"><b id="w-chars-ns">0</b><span>बिना स्पेस</span></div>
      <div class="stat"><b id="w-sent">0</b><span>वाक्य</span></div>
      <div class="stat"><b id="w-read">0</b><span>मिनट पढ़ने में</span></div>
    </div>
  </div>
  <div class="ad-slot">Advertisement</div>
</div>
<script src="../assets/tools.js"></script>
</body>
</html>
