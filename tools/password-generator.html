<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Password Generator — मज़बूत पासवर्ड बनाओ | Toolkit</title>
<meta name="description" content="फ्री पासवर्ड जनरेटर: मज़बूत रैंडम पासवर्ड। कहीं सेव नहीं होता।">
<meta name="theme-color" content="#6c4dff">
<link rel="stylesheet" href="../assets/styles.css?v=4">
</head>
<body>
<div class="tool-top"><a class="back-btn" href="../index.html">←</a><h1>🔑 Password Generator</h1></div>
<div class="tool-body">
  <p style="color:var(--muted);margin-bottom:1rem">मज़बूत पासवर्ड बनाओ — ब्राउज़र में ही, कहीं सेव नहीं होता।</p>
  <div class="panel">
    <div class="field">
      <label>लंबाई <span class="val" id="pass-len-val">16</span></label>
      <input type="range" id="pass-len" min="6" max="40" step="1" value="16">
    </div>
    <div class="field check-row">
      <label><input type="checkbox" id="pass-upper" checked> ABC (बड़े अक्षर)</label>
      <label><input type="checkbox" id="pass-num" checked> 123 (नंबर)</label>
      <label><input type="checkbox" id="pass-sym" checked> @#$ (चिन्ह)</label>
    </div>
    <div class="mono" id="pass-out">—</div>
    <div class="btn-row">
      <button class="btn" id="pass-make">🎲 नया बनाओ</button>
      <button class="btn secondary" id="pass-copy">📋 कॉपी</button>
    </div>
  </div>
  <div class="ad-slot">Advertisement</div>
  <div class="info-card"><h2>सुरक्षा टिप्स</h2><ul><li>हर अकाउंट के लिए अलग पासवर्ड रखो।</li><li>16+ अक्षर का पासवर्ड सबसे अच्छा।</li><li>जहाँ मिले, two-factor authentication चालू करो।</li></ul></div>
</div>
<script src="../assets/tools.js?v=2"></script>
</body>
</html>
